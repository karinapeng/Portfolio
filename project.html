<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Project case study by Kat P.">
  <title>Project — Kat P</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Overpass:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

<body class="case-page">
  <header class="site-header" id="top">
    <a class="wordmark" href="index.html#top" aria-label="Karina Peng, home">Karina Peng</a>
    <nav aria-label="Main navigation">
      <a href="index.html#work">WORK</a>
      <a href="about.html">ABOUT</a>
    </nav>
  </header>

  <main class="case-study" id="case-study">
    <section class="case-showcase" aria-label="Project details and poster">
      <!-- CASE STUDY IMAGE: change the image path in script.js under projectData for this project. -->
      <div class="case-hero-image" role="img" data-hero-image></div>
      <div class="case-side-info">
        <div class="case-intro">
        <h1 class="case-title" data-title></h1>
        <p class="case-kicker"><span class="case-category" data-category></span> · <span data-year></span></p>
        <p class="case-summary" data-summary></p>
        </div>
        <section class="case-details" aria-label="Project details">
          <h2>Tools</h2>
          <div class="case-tools" data-tools></div>
          <h2>Overview</h2>
          <p class="case-overview" data-overview></p>
        </section>
      </div>
    </section>
    <section class="process-section" aria-label="Project process images">
      <div class="process-grid">
        <!-- PROCESS IMAGE SWAP: replace a placeholder div with <img src="assets/process-01.jpg" alt="Describe this process image">. -->
        <div class="process-placeholder" data-process="01"><span>Process image placeholder · 01</span></div>
      </div>
    </section>
    <section class="contact case-contact" id="contact">
      <h2>Let's Work Together!</h2>
      <!-- EDIT EMAIL: update the address in both the mailto: URL and visible text. -->
      <a class="contact-email" href="mailto:jpy.lightspace@gmail.com">jpy.lightspace@gmail.com</a>
      <footer><span>© 2026 Karina Peng</span><a href="#top">Back to top <span class="back-to-top-arrow" aria-hidden="true">↑</span></a></footer>
    </section>
  </main>
